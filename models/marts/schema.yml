 version: 2

models:

  - name: dim_customer
    description: "Customer dimension containing one row per unique customer."
    columns:
      - name: customer_unique_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique

  - name: dim_product
    description: "Product dimension containing one row per product."
    columns:
      - name: product_id
        description: "Unique identifier for the product."
        data_tests:
          - not_null
          - unique

  - name: dim_seller
    description: "Seller dimension containing one row per seller."
    columns:
      - name: seller_id
        description: "Unique identifier for the seller."
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: "Calendar dimension containing one row per date."
    columns:
      - name: date_day
        description: "Calendar date."
        data_tests:
          - not_null
          - unique

  - name: fact_sales
    description: "Sales fact table at order-item grain."
    columns:

      - name: order_id
        description: "Identifier for the order."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item number within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the order item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: seller_id
        description: "Seller associated with the order item."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id

      - name: order_date
        description: "Date when the order was placed."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: customer_unique_id
        description: "Business key identifying the unique customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_unique_id