version: 2

sources:
  - name: olist_raw
    description: "Raw Olist Brazilian E-commerce data loaded into PostgreSQL"

    schema: Raw

    tables:
      - name: olist_customers
        columns:
          - name: customer_id
            data_tests:
              - not_null
              - unique
      - name: olist_geolocation
        columns:
          - name: geolocation_zip_code_prefix
            data_tests:
              - not_null

          - name: geolocation_lat
            data_tests:
              - not_null

          - name: geolocation_lng
            data_tests:
              - not_null
      - name: olist_order_items
        columns:
          - name: order_id
            data_tests:
              - not_null

          - name: order_item_id
            data_tests:
              - not_null

          - name: product_id
            data_tests:
              - not_null

          - name: seller_id
            data_tests:
              - not_null
      - name: olist_order_payments
        columns:
          - name: order_id
            data_tests:
              - not_null

          - name: payment_sequential
            data_tests:
              - not_null

          - name: payment_type
            data_tests:
              - not_null

          - name: payment_value
            data_tests:
              - not_null
      - name: olist_order_reviews
        columns:
          - name: review_id
            data_tests:
              - not_null

          - name: order_id
            data_tests:
              - not_null

          - name: review_score
            data_tests:
              - not_null
      - name: olist_orders
        columns:
          - name: order_id
            data_tests:
              - not_null
              - unique
      - name: olist_products
        columns:
          - name: product_id
            data_tests:
              - not_null
              - unique
      - name: olist_sellers
        columns:
          - name: seller_id
            data_tests:
              - not_null
              - unique
      - name: product_category_translation
        columns:
          - name: product_category_name
            data_tests:
              - not_null

          - name: product_category_name_english
            data_tests:
              - not_null
